plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.radicalcare" // Đặt namespace của ứng dụng
    compileSdk = flutter.compileSdkVersion // Sử dụng phiên bản SDK được chỉ định từ Flutter

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        applicationId = "com.example.radicalcare" // Application ID của bạn
        minSdk = 23 // Phiên bản SDK tối thiểu
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
            // Bật obfuscation nếu cần
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source = "../.."
}
